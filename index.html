<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>旅遊面對面翻譯器 V4</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Noto Sans TC",sans-serif;background:#111827;color:#111827}.app{height:100dvh;display:flex;flex-direction:column}.half{flex:1;min-height:0;padding:9px;display:flex;flex-direction:column}.top{background:#e8eef7;transform:rotate(180deg)}.bottom{background:#fff}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:38px}.top .toolbar{transform:rotate(180deg)}.title{font-weight:800;font-size:14px}.direction{font-size:12px;opacity:.7}.tools{display:flex;gap:6px}button{border:0;border-radius:10px;padding:8px 10px;font-weight:700;background:#e5e7eb;color:#111827}button:active{transform:scale(.97)}.result{flex:1;min-height:0;margin:7px 0;display:flex;align-items:center;justify-content:center;text-align:center;overflow:auto;border-radius:15px;background:rgba(255,255,255,.75);padding:16px;font-size:clamp(25px,6vw,46px);font-weight:800;line-height:1.3;white-space:pre-wrap}.placeholder{font-size:16px;font-weight:500;opacity:.5}.input-row{display:flex;gap:7px}.mic{width:58px;font-size:24px;padding:0;background:#111827;color:#fff}.mic.recording{background:#dc2626}textarea{flex:1;min-height:68px;resize:none;border:1px solid #d1d5db;border-radius:11px;padding:11px;font-size:17px}.langbar{display:flex;gap:7px;margin-top:7px}.langbar button{flex:1}.langbar .active,.primary{background:#111827;color:#fff}.status{font-size:12px;min-height:18px;text-align:center;opacity:.7}.divider{height:2px;background:#cbd5e1;flex:none}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.card{width:min(520px,100%);background:#fff;border-radius:18px;padding:20px}.card h2{margin:0 0 8px}.card p{font-size:13px;line-height:1.5;color:#4b5563}.card input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}</style></head><body><div class="app"><section class="half top"><div class="toolbar"><div><div class="title">對方使用</div><div class="direction" id="topDirection">日文 → 繁體中文</div></div><div class="tools"><button id="speakTop">🔊朗讀</button><button id="clearTop">清除</button></div></div><div class="result" id="topResult"><span class="placeholder">對方說話後，翻譯成繁體中文</span></div><div class="input-row"><button class="mic" id="topMic">🎤</button></div><div class="status" id="topStatus">按住麥克風說話，放開後翻譯</div></section><div class="divider"></div><section class="half bottom"><div class="toolbar"><div><div class="title">我使用</div><div class="direction" id="bottomDirection">繁體中文 → 日文</div></div><div class="tools"><button id="apiBtn">⚙ API設定</button><button id="clearBottom">清除</button></div></div><div class="result" id="bottomResult"><span class="placeholder">翻譯結果會顯示在這裡</span></div><div class="input-row"><textarea id="textInput" placeholder="輸入繁體中文，或按住🎤說話"></textarea><button class="mic" id="bottomMic">🎤</button><button class="primary" id="send">送出</button></div><div class="langbar" id="langBar"><button data-lang="ja" class="active">日文</button><button data-lang="en">英文</button><button data-lang="th">泰文</button></div><div class="status" id="bottomStatus">目前：日文</div></section></div><div class="modal" id="modal"><div class="card"><h2>Google 翻譯 API</h2><p>API Key 儲存在此瀏覽器 localStorage。沒有 Key 或 Google API 失敗時，會嘗試 MyMemory 免費翻譯。</p><input id="apiKey" type="password" placeholder="貼上 Google Cloud Translation API Key"><div class="actions"><button id="cancel">取消</button><button class="primary" id="save">儲存</button></div></div></div><script>
const LANG={ja:{name:'日文',speech:'ja-JP',voice:'ja-JP'},en:{name:'英文',speech:'en-US',voice:'en-US'},th:{name:'泰文',speech:'th-TH',voice:'th-TH'}};const state={target:'ja',apiKey:localStorage.getItem('travelTranslatorGoogleKey')||'',topText:'',bottomText:''};const $=id=>document.getElementById(id);
function setResult(el,text,ph){el.textContent='';if(!text){let s=document.createElement('span');s.className='placeholder';s.textContent=ph;el.appendChild(s)}else el.textContent=text}
function updateUI(){let n=LANG[state.target].name;$('topDirection').textContent=n+' → 繁體中文';$('bottomDirection').textContent='繁體中文 → '+n;$('bottomStatus').textContent='目前：'+n;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.target))}
async function googleTranslate(text,source,target){if(!state.apiKey)throw Error('NO_GOOGLE_KEY');let r=await fetch('https://translation.googleapis.com/language/translate/v2?key='+encodeURIComponent(state.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:text,source,target,format:'text'})});if(!r.ok)throw Error('Google API HTTP '+r.status);let d=await r.json(),t=d?.data?.translations?.[0]?.translatedText;if(!t)throw Error('Google API 無翻譯結果');let x=document.createElement('div');x.innerHTML=t;return x.textContent||t}
async function myMemoryTranslate(text,source,target){let s=source==='zh-TW'?'zh-TW':source.split('-')[0],t=target==='zh-TW'?'zh-TW':target.split('-')[0],u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+encodeURIComponent(s+'|'+t),r=await fetch(u);if(!r.ok)throw Error('MyMemory HTTP '+r.status);let d=await r.json();if(!d?.responseData?.translatedText)throw Error('MyMemory 無翻譯結果');return d.responseData.translatedText}
async function translateText(text,source,target){text=text.trim();if(!text)return'';try{return await googleTranslate(text,source,target)}catch(e){try{return await myMemoryTranslate(text,source,target)}catch(e2){throw Error('翻譯失敗，請確認網路或 API 設定')}}}
async function topTranslate(text){state.topText=text;setResult($('topResult'),'翻譯中…','對方說話後，翻譯成繁體中文');$('topStatus').textContent='翻譯中…';try{let r=await translateText(text,state.target,'zh-TW');setResult($('topResult'),r,'對方說話後，翻譯成繁體中文');$('topStatus').textContent='完成'}catch(e){setResult($('topResult'),'翻譯失敗','對方說話後，翻譯成繁體中文');$('topStatus').textContent=e.message}}
async function bottomTranslate(text){state.bottomText=text;setResult($('bottomResult'),'翻譯中…','翻譯結果會顯示在這裡');$('bottomStatus').textContent='翻譯中…';try{let r=await translateText(text,'zh-TW',state.target);setResult($('bottomResult'),r,'翻譯結果會顯示在這裡');$('bottomStatus').textContent='完成'}catch(e){setResult($('bottomResult'),'翻譯失敗','翻譯結果會顯示在這裡');$('bottomStatus').textContent=e.message}}
function speak(t,lang){if(!t)return;if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;speechSynthesis.speak(u)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;function makeRec(lang,done,status){if(!SR)return null;let r=new SR();r.lang=lang;r.continuous=false;r.interimResults=true;r.maxAlternatives=1;r.onstart=()=>status('正在聽…');r.onerror=e=>status('語音辨識：'+e.error);r.onend=()=>status('按住麥克風說話，放開後翻譯');r.onresult=e=>{let f='',i='';for(let n=e.resultIndex;n<e.results.length;n++){let t=e.results[n][0].transcript;e.results[n].isFinal?f+=t:i+=t}if(i)status('辨識中：'+i);if(f.trim())done(f.trim())};return r}
let topRec,bottomRec;function hold(btn,start,stop){let held=false;btn.addEventListener('pointerdown',e=>{e.preventDefault();held=true;btn.setPointerCapture?.(e.pointerId);start()});['pointerup','pointercancel','pointerleave'].forEach(t=>btn.addEventListener(t,()=>{if(held){held=false;stop()}}))}
function startTop(){if(!SR){$('topStatus').textContent='此瀏覽器不支援語音輸入，請使用 Chrome';return}if(topRec)try{topRec.stop()}catch(e){}topRec=makeRec(LANG[state.target].speech,topTranslate,m=>$('topStatus').textContent=m);try{topRec.start()}catch(e){}}function stopTop(){if(topRec)try{topRec.stop()}catch(e){}}
function startBottom(){if(!SR){$('bottomStatus').textContent='此瀏覽器不支援語音輸入，請使用 Chrome';return}if(bottomRec)try{bottomRec.stop()}catch(e){}bottomRec=makeRec('zh-TW',bottomTranslate,m=>$('bottomStatus').textContent=m);try{bottomRec.start()}catch(e){}}function stopBottom(){if(bottomRec)try{bottomRec.stop()}catch(e){}}
hold($('topMic'),startTop,stopTop);hold($('bottomMic'),startBottom,stopBottom);$('send').onclick=()=>bottomTranslate($('textInput').value);$('langBar').onclick=e=>{let b=e.target.closest('[data-lang]');if(b){state.target=b.dataset.lang;updateUI()}};$('speakTop').onclick=()=>speak(state.topText,'zh-TW');$('clearTop').onclick=()=>{state.topText='';setResult($('topResult'),'','對方說話後，翻譯成繁體中文')};$('clearBottom').onclick=()=>{state.bottomText='';$('textInput').value='';setResult($('bottomResult'),'','翻譯結果會顯示在這裡');updateUI()};$('apiBtn').onclick=()=>{$('apiKey').value=state.apiKey;$('modal').classList.add('show')};$('cancel').onclick=()=>$('modal').classList.remove('show');$('save').onclick=()=>{state.apiKey=$('apiKey').value.trim();state.apiKey?localStorage.setItem('travelTranslatorGoogleKey',state.apiKey):localStorage.removeItem('travelTranslatorGoogleKey');$('modal').classList.remove('show');$('bottomStatus').textContent=state.apiKey?'API Key 已儲存':'已清除 API Key，將使用免費備援翻譯'};updateUI();
</script></body></html>
