<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>旅遊面對面翻譯器</title>
<style>
  :root{--bg:#111827;--panel:#1f2937;--panel2:#f8fafc;--text:#f8fafc;--dark:#111827;--muted:#94a3b8;--accent:#22c55e;--danger:#ef4444;--line:#334155}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
  body{background:var(--bg)}
  button,input{font:inherit}
  .app{height:100dvh;height:100vh;display:flex;flex-direction:column}
  .top{height:50%;min-height:0;background:#0f172a;color:white;position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden;transform:rotate(180deg)}
  .bottom{height:50%;min-height:0;background:var(--panel2);color:var(--dark);position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .content{padding:18px;display:flex;flex-direction:column;gap:12px;height:100%;justify-content:center}
  .top .content{transform:rotate(0)}
  .label{font-size:15px;font-weight:800;letter-spacing:.04em;text-align:center;opacity:.85}
  .result{flex:0 1 auto;min-height:90px;max-height:48%;overflow:auto;text-align:center;font-size:clamp(25px,7vw,44px);font-weight:750;line-height:1.35;display:flex;align-items:center;justify-content:center;word-break:break-word;padding:4px}
  .source{font-size:16px;line-height:1.4;text-align:center;opacity:.72;max-height:18%;overflow:auto}
  .mic{width:min(31vw,118px);height:min(31vw,118px);min-width:82px;min-height:82px;border:0;border-radius:50%;align-self:center;background:var(--accent);color:#052e16;font-size:42px;box-shadow:0 8px 30px #0005;cursor:pointer;touch-action:none}
  .mic.listening{background:var(--danger);color:white;animation:pulse 1.1s infinite}
  @keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 16px #ef444422}}
  .hint{text-align:center;font-size:14px;color:var(--muted);font-weight:650}
  .bottom .hint{color:#64748b}
  .input-row{display:flex;gap:8px;align-items:stretch}.input-actions{display:flex;flex-direction:column;gap:8px;min-width:72px}.bottom-mic{flex:1;border:0;border-radius:16px;background:#e2e8f0;font-size:30px;cursor:pointer;touch-action:none}.bottom-mic.listening{background:#ef4444;color:#fff;animation:pulse 1.1s infinite}.speech-note{text-align:center;font-size:12px;color:#64748b;font-weight:650}
  textarea{width:100%;height:78px;resize:none;border:2px solid #cbd5e1;border-radius:16px;padding:13px 14px;font-size:20px;line-height:1.35;outline:none;background:white;color:#0f172a}
  textarea:focus{border-color:#64748b}
  .send{width:82px;border:0;border-radius:16px;background:#111827;color:white;font-size:24px;font-weight:800}
  .toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:5}
  .top .toolbar{transform:rotate(180deg)}
  .toolbar-group{display:flex;gap:7px}
  .tool{border:1px solid #475569;background:#1e293bcc;color:white;border-radius:12px;padding:9px 11px;font-size:14px;font-weight:800;backdrop-filter:blur(8px)}
  .bottom .tool{background:white;color:#0f172a;border-color:#cbd5e1}
  .langbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .lang{min-width:90px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:14px;background:white;font-weight:900;font-size:17px}
  .lang.active{background:#111827;color:white;border-color:#111827}
  .status{position:absolute;bottom:8px;left:10px;right:10px;text-align:center;font-size:12px;color:#64748b}
  .top .status{transform:rotate(180deg);color:#94a3b8}
  .modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
  .modal.show{display:flex}
  .card{width:min(520px,100%);background:white;color:#111827;border-radius:22px;padding:22px;box-shadow:0 20px 60px #0008}
  .card h2{margin:0 0 8px;font-size:22px}.card p{font-size:14px;line-height:1.55;color:#475569}
  .card input{width:100%;padding:13px;border:2px solid #cbd5e1;border-radius:12px;font-size:16px}
  .actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;padding:13px;border:0;border-radius:12px;font-weight:850}
  .save{background:#111827;color:white}.close{background:#e2e8f0}
  .engine{font-size:12px;text-align:center;color:#64748b;margin-top:8px}
  @media (orientation:landscape){.result{font-size:clamp(22px,5vw,38px)}.mic{width:82px;height:82px}}
</style>
</head>
<body>
<div class="app">

  <section class="top">
    <div class="toolbar">
      <div class="toolbar-group">
        <button class="tool" id="speakBtn" title="朗讀翻譯結果">🔊 朗讀</button>
      </div>
      <button class="tool" id="clearBtnTop">清除</button>
    </div>
    <div class="content">
      <div class="label" id="targetLabel">🇯🇵 日文</div>
      <div class="result" id="topResult">按住麥克風說話</div>
      <div class="source" id="topSource"></div>
      <button class="mic" id="micBtn" aria-label="按住說話">🎤</button>
      <div class="hint" id="micHint">按住說話・放開後翻譯成繁體中文</div>
    </div>
    <div class="status" id="topStatus">翻譯引擎：待機</div>
  </section>

  <section class="bottom">
    <div class="toolbar">
      <button class="tool" id="settingsBtn">⚙ API設定</button>
      <div class="toolbar-group">
        <button class="tool" id="swapBtn">🔄 交換</button>
        <button class="tool" id="clearBtnBottom">清除</button>
      </div>
    </div>
    <div class="content">
      <div class="label">🇹🇼 繁體中文</div>
      <div class="input-row">
        <textarea id="textInput" placeholder="在這裡打字，送出後翻譯…" lang="zh-TW"></textarea>
        <button class="send" id="sendBtn">翻譯</button>
      </div>
      <div class="langbar" aria-label="翻譯目標語言">
        <button class="lang active" data-lang="th">🇹🇭 泰文</button>
        <button class="lang" data-lang="en">🇺🇸 英文</button>
        
      </div>
      <div class="engine" id="engineInfo">Google Cloud 優先；失敗時自動嘗試免費備援</div>
    </div>
    <div class="status" id="bottomStatus">下方：繁體中文 → 泰文</div>
  </section>
</div>

<div class="modal" id="modal">
  <div class="card">
    <h2>Google Cloud Translation</h2>
    <p>輸入你自己的 Google Cloud Translation API Key。Key 只儲存在這台手機的瀏覽器 localStorage，不會上傳到本頁面伺服器。若未設定或 Google 翻譯失敗，網頁會自動嘗試免費公開備援端點。</p>
    <input id="apiKey" type="password" placeholder="Google Cloud Translation API Key">
    <div class="actions">
      <button class="close" id="cancelSettings">取消</button>
      <button class="save" id="saveSettings">儲存</button>
    </div>
    <p style="margin-bottom:0">提醒：API Key 放在純 HTML 前端並非最安全的做法，正式公開部署應改用後端代理。旅遊自用可使用限制過的 API Key。</p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const state = {
  target: localStorage.getItem('targetLang') || 'ja',
  apiKey: localStorage.getItem('googleTranslateApiKey') || '',
  engine: '—',
  recognition: null,
  listening: false
};
const LANG = {
  'zh-TW': {name:'繁體中文', speech:'zh-TW', flag:'🇹🇼'},
  'ja': {name:'日文', speech:'ja-JP', flag:'🇯🇵'},
  'en': {name:'英文', speech:'en-US', flag:'🇺🇸'},
  'th': {name:'泰文', speech:'th-TH', flag:'🇹🇭'}
};

function setTarget(lang){
  state.target=lang; localStorage.setItem('targetLang',lang);
  document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  $('targetLabel').textContent = LANG[lang].flag+' '+LANG[lang].name;
  $('bottomStatus').textContent = '下方：繁體中文 → '+LANG[lang].name;
}
setTarget(state.target);

function setStatus(text){$('topStatus').textContent=text}
function setEngine(text){state.engine=text;$('engineInfo').textContent=text}

async function googleTranslate(text, target){
  if(!state.apiKey) throw new Error('NO_KEY');
  const url='https://translation.googleapis.com/language/translate/v2?key='+encodeURIComponent(state.apiKey);
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:text,source:'zh-TW',target:target.split('-')[0],format:'text'})});
  if(!r.ok) throw new Error('GOOGLE_'+r.status);
  const j=await r.json();
  const out=j?.data?.translations?.[0]?.translatedText;
  if(!out) throw new Error('GOOGLE_EMPTY');
  return decodeHTMLEntities(out);
}

async function myMemoryTranslate(text,target){
  const langpair='zh-TW|'+target.split('-')[0];
  const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+encodeURIComponent(langpair);
  const r=await fetch(url);
  if(!r.ok) throw new Error('MYMEMORY_'+r.status);
  const j=await r.json();
  const out=j?.responseData?.translatedText;
  if(!out || j?.responseStatus !== 200) throw new Error('MYMEMORY_EMPTY');
  return decodeHTMLEntities(out);
}

function decodeHTMLEntities(s){
  const el=document.createElement('textarea'); el.innerHTML=s; return el.value;
}

async function googleTranslateWithSource(text,source,target){
  if(!state.apiKey) throw new Error('NO_GOOGLE_KEY');
  const url='https://translation.googleapis.com/language/translate/v2?key='+encodeURIComponent(state.apiKey);
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:text,source:source,target:target,format:'text'})});
  if(!r.ok) throw new Error('GOOGLE_'+r.status);
  const j=await r.json();
  const out=j?.data?.translations?.[0]?.translatedText;
  if(!out) throw new Error('GOOGLE_EMPTY');
  return decodeHTMLEntities(out);
}

async function myMemoryTranslateWithSource(text,source,target){
  const langpair=source.split('-')[0]+'|'+target.split('-')[0];
  const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+encodeURIComponent(langpair);
  const r=await fetch(url);
  if(!r.ok) throw new Error('MYMEMORY_'+r.status);
  const j=await r.json();
  const out=j?.responseData?.translatedText;
  if(!out || j?.responseStatus !== 200) throw new Error('MYMEMORY_EMPTY');
  return decodeHTMLEntities(out);
}

async function translate(text,target=state.target){
  if(!text.trim()) return '';
  setStatus('翻譯中…');
  try{
    const out=await googleTranslate(text,target);
    setEngine('翻譯引擎：Google Cloud Translation');
    setStatus('Google Cloud 翻譯完成');
    return out;
  }catch(e){
    console.warn('Google failed:',e);
    try{
      const out=await myMemoryTranslate(text,target);
      setEngine('翻譯引擎：免費備援 MyMemory');
      setStatus('Google 不可用，已自動切換免費備援');
      return out;
    }catch(e2){
      console.warn('Fallback failed:',e2);
      setEngine('翻譯引擎：無法連線');
      setStatus('翻譯失敗：請檢查網路');
      throw e2;
    }
  }
}

function showTranslation(source, translated){
  $('topSource').textContent=source;
  $('topResult').textContent=translated || '—';
}

async function translateTyped(){
  const text=$('textInput').value.trim();
  if(!text) return;
  const btn=$('sendBtn'); btn.disabled=true; btn.textContent='…';
  try{
    const out=await translate(text,state.target);
    showTranslation(text,out);
  }finally{
    btn.disabled=false; btn.textContent='翻譯';
  }
}
$('sendBtn').onclick=translateTyped;
$('textInput').addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();translateTyped();}
});
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{
  setTarget(b.dataset.lang);
  const text=$('textInput').value.trim();
  if(text) translateTyped();
});

function initRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    $('micHint').textContent='此瀏覽器不支援語音辨識，請改用 Chrome / Safari（依裝置支援情況）';
    $('micBtn').disabled=true;
    return null;
  }
  const r=new SR();
  r.lang='zh-TW';
  r.continuous=false;
  r.interimResults=true;
  r.maxAlternatives=1;
  r.onstart=()=>{state.listening=true;$('micBtn').classList.add('listening');$('micHint').textContent='正在聽…說完放開';setStatus('正在語音辨識…')};
  r.onresult=async e=>{
    let finalText='', interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) finalText+=t; else interim+=t;
    }
    $('topSource').textContent=finalText||interim;
    if(finalText){
      try{const out=await translate(finalText,state.target); showTranslation(finalText,out)}
      catch(err){$('topResult').textContent='翻譯失敗'}
    }
  };
  r.onerror=e=>{console.warn(e);setStatus('語音辨識：'+e.error);};
  r.onend=()=>{state.listening=false;$('micBtn').classList.remove('listening');$('micHint').textContent='按住說話・放開後翻譯成繁體中文'};
  return r;
}
state.recognition=initRecognition();

function startMic(){
  if(!state.recognition) return;
  try{
    state.recognition.lang=LANG[state.target].speech;
    state.recognition.start();
  }catch(e){}
}
function stopMic(){
  if(state.recognition && state.listening) state.recognition.stop();
}
$('micBtn').addEventListener('pointerdown',e=>{e.preventDefault();startMic()});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('micBtn').addEventListener(ev,e=>{e.preventDefault();stopMic()}));

function clearAll(){
  $('topResult').textContent='按住麥克風說話';
  $('topSource').textContent='';
  $('textInput').value='';
  setStatus('翻譯引擎：待機');
}
$('clearBtnTop').onclick=clearAll;
$('clearBtnBottom').onclick=clearAll;

$('speakBtn').onclick=()=>{
  const text=$('topResult').textContent.trim();
  if(!text || text==='按住麥克風說話') return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-TW';
  speechSynthesis.cancel(); speechSynthesis.speak(u);
};

$('swapBtn').onclick=()=>{
  // 本版本固定下方輸入為繁中；交換只在三語言間輪替目標，避免把介面弄複雜。
  const order=['th','en'];
  const i=order.indexOf(state.target);
  setTarget(order[(i+1)%order.length]);
};

$('settingsBtn').onclick=()=>{
  $('apiKey').value=state.apiKey;
  $('modal').classList.add('show');
};
$('cancelSettings').onclick=()=>$('modal').classList.remove('show');
$('saveSettings').onclick=()=>{
  state.apiKey=$('apiKey').value.trim();
  if(state.apiKey)localStorage.setItem('googleTranslateApiKey',state.apiKey);
  else localStorage.removeItem('googleTranslateApiKey');
  $('modal').classList.remove('show');
  setEngine(state.apiKey?'Google Cloud 優先；失敗時自動嘗試免費備援':'尚未設定 Google Key；目前會直接使用免費備援');
};
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('show')});

if(document.documentElement.requestFullscreen){
  // 不自動強制全螢幕；手機瀏覽器通常要求使用者手勢後才能進入。
  document.addEventListener('dblclick',()=>document.documentElement.requestFullscreen().catch(()=>{}));
}
setEngine(state.apiKey?'Google Cloud 優先；失敗時自動嘗試免費備援':'尚未設定 Google Key；目前會直接使用免費備援');
</script>
</body>
</html>
