<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>面對面旅遊翻譯器 V4</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#121212">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 上半部：給對方使用（旋轉 180 度） */
        .section-target { flex: 1; background-color: #1a1a1a; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; transform: rotate(180deg); border-bottom: 2px dashed #333; }
        
        /* 下半部：給你使用 */
        .section-source { flex: 1; background-color: #121212; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        
        /* 文字顯示區域 */
        .display-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 10px; font-size: 24px; font-weight: bold; word-break: break-all; overflow-y: auto; }
        .sub-text { font-size: 16px; color: #8aa4af; margin-top: 8px; }
        
        /* 控制區域 */
        .control-area { display: flex; flex-direction: column; gap: 12px; width: 100%; align-items: center; }
        .button-group { display: flex; gap: 10px; width: 100%; justify-content: center; }
        
        /* 按鈕樣式 */
        button { background-color: #333; color: white; border: none; padding: 12px 20px; border-radius: 25px; font-size: 16px; cursor: pointer; transition: background 0.2s; font-weight: 500; }
        button:active { opacity: 0.7; }
        
        /* 麥克風大按鈕 */
        .btn-mic { width: 70px; height: 70px; border-radius: 50%; background-color: #ff3b30; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(255, 59, 48, 0.3); }
        .btn-mic.recording { background-color: #34c759; animation: pulse 1.5s infinite; }
        
        /* 語言選擇與翻譯按鈕 */
        .lang-select { background-color: #2a2a2a; color: white; border: 1px solid #444; padding: 10px 15px; border-radius: 20px; font-size: 16px; outline: none; }
        .btn-translate { background-color: #007aff; color: white; padding: 10px 25px; border-radius: 20px; }
        
        /* 輸入框 */
        .input-box { width: 100%; background-color: #222; border: 1px solid #333; border-radius: 12px; padding: 12px; color: white; font-size: 16px; resize: none; outline: none; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- 上半部：給對方使用 -->
    <div class="section-target">
        <!-- 修正版：保留翻譯結果顯示區，讓你輸入的翻譯能出現在這裡給對方看 -->
        <div class="display-area" id="targetDisplay">
            <div>等待翻譯...</div>
            <div class="sub-text" id="targetSub">對方看這裡</div>
        </div>
        <div class="control-area">
            <!-- 依照要求：上方只保留麥克風按鈕 -->
            <button class="btn-mic" id="targetMicBtn">🎤</button>
        </div>
    </div>

    <!-- 下半部：給你使用 -->
    <div class="section-source">
        <div class="display-area" id="sourceDisplay">
            <div>等待翻譯...</div>
            <div class="sub-text">你聽/看這裡</div>
        </div>
        <div class="control-area">
            <textarea class="input-box" id="sourceInput" rows="2" placeholder="請輸入中文..."></textarea>
            <div class="button-group">
                <select class="lang-select" id="langSelect">
                    <option value="ja-JP">🇯🇵 日文</option>
                    <option value="en-US">🇺🇸 英文</option>
                    <option value="th-TH">🇹🇭 泰文</option>
                </select>
                <button class="btn-mic" id="sourceMicBtn" style="width:45px; height:45px; font-size:18px; padding:0;">🎤</button>
                <button class="btn-translate" id="translateBtn">翻譯</button>
            </div>
        </div>
    </div>

    <script>
        // 註冊 PWA Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log('SW Registered'));
        }

        // 初始化語音辨識 API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let currentRecognizingTarget = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                if (currentRecognizingTarget === 'source') {
                    document.getElementById('sourceMicBtn').classList.add('recording');
                } else if (currentRecognizingTarget === 'target') {
                    document.getElementById('targetMicBtn').classList.add('recording');
                }
            };

            recognition.onend = () => {
                document.getElementById('sourceMicBtn').classList.remove('recording');
                document.getElementById('targetMicBtn').classList.remove('recording');
                currentRecognizingTarget = null;
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                if (currentRecognizingTarget === 'source') {
                    document.getElementById('sourceInput').value = text;
                    executeTranslation(); // 自主說完中文直接翻譯
                } else if (currentRecognizingTarget === 'target') {
                    // 對方說話，直接將對方的語言送去翻成繁體中文
                    const targetLang = document.getElementById('langSelect').value;
                    requestTranslate(text, targetLang, 'zh-TW', (result) => {
                        document.getElementById('sourceDisplay').innerHTML = `<div>${result}</div><div class="sub-text">原文: ${text}</div>`;
                        speakText(result, 'zh-TW');
                    });
                }
            };
        } else {
            alert('此瀏覽器不支援語音辨識，請使用 Chrome 或 Safari。');
        }

        // 綁定按鈕事件
        document.getElementById('sourceMicBtn').addEventListener('click', () => {
            if (!recognition) return;
            currentRecognizingTarget = 'source';
            recognition.lang = 'zh-TW';
            recognition.start();
        });

        document.getElementById('targetMicBtn').addEventListener('click', () => {
            if (!recognition) return;
            currentRecognizingTarget = 'target';
            recognition.lang = document.getElementById('langSelect').value;
            recognition.start();
        });

        document.getElementById('translateBtn').addEventListener('click', executeTranslation);

        // 處理你輸入中文翻譯給對方
        function executeTranslation() {
            const text = document.getElementById('sourceInput').value;
            const targetLang = document.getElementById('langSelect').value;
            if (!text.trim()) return;

            requestTranslate(text, 'zh-TW', targetLang, (result) => {
                // 修正：將翻譯結果正確顯示在「上半部給對方看」的區塊
                document.getElementById('targetDisplay').innerHTML = `<div>${result}</div><div class="sub-text">原文: ${text}</div>`;
                speakText(result, targetLang);
            });
        }

        // 免費翻譯 API（使用公用不需 Key 的本機/線上代理方案）
        function requestTranslate(text, from, to, callback) {
            const fromLang = from.split('-')[0];
            const toLang = to.split('-')[0];
            const url = `https://googleapis.com{fromLang}&tl=${toLang}&dt=t&q=${encodeURIComponent(text)}`;
            
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data && data[0] && data[0][0]) {
                        callback(data[0][0][0]);
                    }
                })
                .catch(err => {
                    console.error(err);
                    callback('翻譯失敗，請檢查網路');
                });
        }

        // 語音播放功能
        function speakText(text, lang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
