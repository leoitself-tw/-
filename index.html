<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>旅遊面對面翻譯器</title>
<style>
  :root{--bg:#111827;--panel:#1f2937;--panel2:#f8fafc;--text:#f8fafc;--dark:#111827;--muted:#94a3b8;--accent:#22c55e;--danger:#ef4444;--line:#334155}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
  body{background:var(--bg)}
  button,input{font:inherit}
  .app{height:100dvh;height:100vh;display:flex;flex-direction:column}
  .top{height:50%;min-height:0;background:#0f172a;color:white;position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden;transform:rotate(180deg)}
  .bottom{height:50%;min-height:0;background:var(--panel2);color:var(--dark);position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .content{padding:18px;display:flex;flex-direction:column;gap:12px;height:100%;justify-content:center}
  .top .content{transform:rotate(0)}
  .label{font-size:15px;font-weight:800;letter-spacing:.04em;text-align:center;opacity:.85}
  .result{flex:0 1 auto;min-height:90px;max-height:48%;overflow:auto;text-align:center;font-size:clamp(25px,7vw,44px);font-weight:750;line-height:1.35;display:flex;align-items:center;justify-content:center;word-break:break-word;padding:4px}
  .source{font-size:16px;line-height:1.4;text-align:center;opacity:.72;max-height:18%;overflow:auto}
  .mic{width:min(31vw,118px);height:min(31vw,118px);min-width:82px;min-height:82px;border:0;border-radius:50%;align-self:center;background:var(--accent);color:#052e16;font-size:42px;box-shadow:0 8px 30px #0005;cursor:pointer;touch-action:none}
  .mic.listening{background:var(--danger);color:white;animation:pulse 1.1s infinite}
  @keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 16px #ef444422}}
  .hint{text-align:center;font-size:14px;color:var(--muted);font-weight:650}
  .bottom .hint{color:#64748b}
  .input-row{display:flex;gap:8px;align-items:stretch}.input-actions{display:flex;flex-direction:column;gap:8px;min-width:72px}.bottom-mic{flex:1;border:0;border-radius:16px;background:#e2e8f0;font-size:30px;cursor:pointer;touch-action:none}.bottom-mic.listening{background:#ef4444;color:#fff;animation:pulse 1.1s infinite}.speech-note{text-align:center;font-size:12px;color:#64748b;font-weight:650}
  textarea{width:100%;height:78px;resize:none;border:2px solid #cbd5e1;border-radius:16px;padding:13px 14px;font-size:20px;line-height:1.35;outline:none;background:white;color:#0f172a}
  textarea:focus{border-color:#64748b}
  .send{width:82px;border:0;border-radius:16px;background:#111827;color:white;font-size:24px;font-weight:800}
  .toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:5}
  .top .toolbar{transform:rotate(180deg)}
  .toolbar-group{display:flex;gap:7px}
  .tool{border:1px solid #475569;background:#1e293bcc;color:white;border-radius:12px;padding:9px 11px;font-size:14px;font-weight:800;backdrop-filter:blur(8px)}
  .bottom .tool{background:white;color:#0f172a;border-color:#cbd5e1}
  .langbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .lang{min-width:90px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:14px;background:white;font-weight:900;font-size:17px}
  .lang.active{background:#111827;color:white;border-color:#111827}
  .status{position:absolute;bottom:8px;left:10px;right:10px;text-align:center;font-size:12px;color:#64748b}
  .top .status{transform:rotate(180deg);color:#94a3b8}
  .modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
  .modal.show{display:flex}
  .card{width:min(520px,100%);background:white;color:#111827;border-radius:22px;padding:22px;box-shadow:0 20px 60px #0008}
  .card h2{margin:0 0 8px;font-size:22px}.card p{font-size:14px;line-height:1.55;color:#475569}
  .card input{width:100%;padding:13px;border:2px solid #cbd5e1;border-radius:12px;font-size:16px}
  .actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;padding:13px;border:0;border-radius:12px;font-weight:850}
  .save{background:#111827;color:white}.close{background:#e2e8f0}
  .engine{font-size:12px;text-align:center;color:#64748b;margin-top:8px}
  @media (orientation:landscape){.result{font-size:clamp(22px,5vw,38px)}.mic{width:82px;height:82px}}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅遊翻譯器">
<meta name="application-name" content="旅遊翻譯器">
<meta name="theme-color" content="#111827">

</head>
<body>
<div class="app">

  <section class="top">
    <div class="toolbar">
      <div class="toolbar-group">
        <button class="tool" id="speakBtn" title="朗讀翻譯結果">🔊 朗讀</button>
      </div>
      <button class="tool" id="clearBtnTop">清除</button>
    </div>
    <div class="content">
      <div class="label" id="targetLabel">🇹🇭 泰文</div>
      <div class="result" id="topResult">按住麥克風說話</div>
      <div class="source" id="topSource"></div>
      <button class="mic" id="micBtn" aria-label="按住說話">🎤</button>
      <div class="hint" id="micHint">按住說話・放開後自動翻譯</div>
    </div>
    <div class="status" id="topStatus">翻譯引擎：待機</div>
  </section>

  <section class="bottom">
    <div class="toolbar">
      <button class="tool" id="settingsBtn">⚙ API設定</button>
      <div class="toolbar-group">
        <button class="tool" id="swapBtn">🔄 交換</button>
        <button class="tool" id="clearBtnBottom">清除</button>
      </div>
    </div>
    <div class="content">
      <div class="label">🇹🇼 繁體中文</div>
      <div class="input-row">
        <textarea id="textInput" placeholder="在這裡打字，送出後翻譯…" lang="zh-TW"></textarea>
        <button class="send" id="sendBtn">翻譯</button>
      </div>
      <div class="langbar" aria-label="翻譯目標語言">
        <button class="lang active" data-lang="th">🇹🇭 泰文</button>
        <button class="lang" data-lang="en">🇺🇸 英文</button>
        
      </div>
      <div class="engine" id="engineInfo">Google Cloud 優先；失敗時自動嘗試免費備援</div>
    </div>
    <div class="status" id="bottomStatus">目前方向：繁體中文 → 泰文</div>
  </section>
</div>

<div class="modal" id="modal">
  <div class="card">
    <h2>Google Cloud Translation</h2>
    <p>輸入你自己的 Google Cloud Translation API Key。Key 只儲存在這台手機的瀏覽器 localStorage，不會上傳到本頁面伺服器。若未設定或 Google 翻譯失敗，網頁會自動嘗試免費公開備援端點。</p>
    <input id="apiKey" type="password" placeholder="Google Cloud Translation API Key">
    <div class="actions">
      <button class="close" id="cancelSettings">取消</button>
      <button class="save" id="saveSettings">儲存</button>
    </div>
    <p style="margin-bottom:0">提醒：API Key 放在純 HTML 前端並非最安全的做法，正式公開部署應改用後端代理。旅遊自用可使用限制過的 API Key。</p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const state = {
  target: localStorage.getItem('targetLang') || 'th',
  apiKey: localStorage.getItem('googleTranslateApiKey') || '',
  engine: '—',
  recognition: null,
  listening: false
};
const LANG = {
  'zh-TW': {name:'繁體中文', speech:'zh-TW', flag:'🇹🇼'},
  'en': {name:'英文', speech:'en-US', flag:'🇺🇸'},
  'th': {name:'泰文', speech:'th-TH', flag:'🇹🇭'}
};

function setTarget(lang){
  state.target=lang; localStorage.setItem('targetLang',lang);
  document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  $('targetLabel').textContent = LANG[lang].flag+' '+LANG[lang].name;
  $('bottomStatus').textContent = '目前方向：繁體中文 → '+LANG[lang].name;
}
setTarget(state.target);

function setStatus(text){$('topStatus').textContent=text}
function setEngine(text){state.engine=text;$('engineInfo').textContent=text}

// 註冊 Service Worker 確保離線可用
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker 註冊成功', reg))
      .catch(err => console.log('Service Worker 註冊失敗', err));
  });
}
</script>
</body>
</html>
