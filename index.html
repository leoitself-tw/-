<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雙向面對面旅遊翻譯器 V4</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#121212">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 上半部：給對方使用（倒轉 180 度） */
        .section-target { flex: 1; background-color: #1a1a1a; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; transform: rotate(180deg); border-bottom: 2px dashed #333; }
        
        /* 下半部：給你使用 */
        .section-source { flex: 1; background-color: #121212; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; }
        
        /* 文字顯示區域 */
        .display-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 10px; font-size: 26px; font-weight: bold; word-break: break-all; overflow-y: auto; }
        .sub-text { font-size: 16px; color: #8aa4af; margin-top: 8px; font-weight: normal; }
        
        /* 控制區域 */
        .control-area { display: flex; flex-direction: column; gap: 12px; width: 100%; align-items: center; }
        .button-group { display: flex; gap: 12px; width: 100%; justify-content: center; align-items: center; }
        
        /* 通用按鈕 */
        button { background-color: #333; color: white; border: none; padding: 12px 20px; border-radius: 25px; font-size: 16px; cursor: pointer; transition: background 0.2s; font-weight: 500; }
        button:active { opacity: 0.7; }
        
        /* 麥克風按鈕外觀 */
        .btn-mic { width: 75px; height: 75px; border-radius: 50%; background-color: #ff3b30; font-size: 32px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(255, 59, 48, 0.4); }
        .btn-mic.recording { background-color: #34c759; box-shadow: 0 4px 12px rgba(52, 199, 89, 0.4); animation: pulse 1.5s infinite; }
        
        /* 語言下拉選單與翻譯按鈕 */
        .lang-select { background-color: #2a2a2a; color: white; border: 1px solid #444; padding: 12px 18px; border-radius: 20px; font-size: 16px; outline: none; -webkit-appearance: none; }
        .btn-translate { background-color: #007aff; color: white; padding: 12px 28px; border-radius: 20px; font-size: 16px; }
        
        /* 中文輸入框 */
        .input-box { width: 100%; background-color: #222; border: 1px solid #333; border-radius: 12px; padding: 12px; color: white; font-size: 16px; resize: none; outline: none; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- 上半部：給對方使用（對面視角，看你翻過去的成果、按麥克風講話） -->
    <div class="section-target">
        <div class="display-area" id="targetDisplay">
            <div id="targetText">等待翻譯...</div>
            <div class="sub-text" id="targetSub">（翻譯結果會顯示在此）</div>
        </div>
        <div class="control-area">
            <!-- 依要求：上方只留麥克風按鈕，辨識語系自動跟隨下方設定 -->
            <button class="btn-mic" id="targetMicBtn">🎤</button>
        </div>
    </div>

    <!-- 下半部：給你使用（你的視角，看對面翻回來的成果、選擇語系、輸入中文） -->
    <div class="section-source">
        <div class="display-area" id="sourceDisplay">
            <div id="sourceText">請在下方輸入或說話</div>
            <div class="sub-text" id="sourceSub">（對方說的話會翻成中文顯示在此）</div>
        </div>
        <div class="control-area">
            <textarea class="input-box" id="sourceInput" rows="2" placeholder="請輸入中文..."></textarea>
            <div class="button-group">
                <select class="lang-select" id="langSelect">
                    <option value="ja-JP">🇯🇵 日文</option>
                    <option value="en-US">🇺🇸 英文</option>
                    <option value="th-TH">🇹🇭 泰文</option>
                </select>
                <button class="btn-mic" id="sourceMicBtn" style="width:48px; height:48px; font-size:20px;">🎤</button>
                <button class="btn-translate" id="translateBtn">翻譯</button>
            </div>
        </div>
    </div>

    <script>
        // 註冊 PWA 離線支援
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log('PWA Service Worker 已就緒'));
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let currentActiveUser = null; // 'source' (你) 或 'target' (對方)

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                if (currentActiveUser === 'source') {
                    document.getElementById('sourceMicBtn').classList.add('recording');
                } else if (currentActiveUser === 'target') {
                    document.getElementById('targetMicBtn').classList.add('recording');
                }
            };

            recognition.onend = () => {
                document.getElementById('sourceMicBtn').classList.remove('recording');
                document.getElementById('targetMicBtn').classList.remove('recording');
                currentActiveUser = null;
            };

            recognition.onresult = (event) => {
                const resultText = event.results[0][0].transcript;
                
                if (currentActiveUser === 'source') {
                    // 你說中文
                    document.getElementById('sourceInput').value = resultText;
                    translateYourChinese(resultText);
                } else if (currentActiveUser === 'target') {
                    // 對方說外語 (日/英/泰) -> 翻成繁體中文給你看
                    const currentLang = document.getElementById('langSelect').value;
                    translatePartnerLanguage(resultText, currentLang);
                }
            };
        }

        // 綁定按鈕監聽
        document.getElementById('sourceMicBtn').addEventListener('click', () => {
            if (!recognition) return alert('不支援語音辨識');
            currentActiveUser = 'source';
            recognition.lang = 'zh-TW';
            recognition.start();
        });

        document.getElementById('targetMicBtn').addEventListener('click', () => {
            if (!recognition) return alert('不支援語音辨識');
            currentActiveUser = 'target';
            // 連動邏輯：上方對方的收音語系直接跟隨你下方下拉選單的決定
            recognition.lang = document.getElementById('langSelect').value;
            recognition.start();
        });

        document.getElementById('translateBtn').addEventListener('click', () => {
            const input = document.getElementById('sourceInput').value;
            if (input.trim()) translateYourChinese(input);
        });

        // 核心邏輯 A：你輸入/說中文 -> 翻成外語給上方對方看
        function translateYourChinese(text) {
            const targetLangCode = document.getElementById('langSelect').value;
            callTranslateAPI(text, 'zh-TW', targetLangCode, (translatedText) => {
                document.getElementById('targetText').innerText = translatedText;
                document.getElementById('targetSub').innerText = `原文: ${text}`;
                speakTTS(translatedText, targetLangCode);
            });
        }

        // 核心邏輯 B：對方按上方按鈕說話 -> 翻成繁體中文給下方你看
        function translatePartnerLanguage(text, fromLangCode) {
            callTranslateAPI(text, fromLangCode, 'zh-TW', (translatedText) => {
                document.getElementById('sourceText').innerText = translatedText;
                document.getElementById('sourceSub').innerText = `原文 (${fromLangCode.split('-')[0].toUpperCase()}): ${text}`;
                speakTTS(translatedText, 'zh-TW');
            });
        }

        // Google Translate 公用免費代理管道
        function callTranslateAPI(text, from, to, successCallback) {
            const sLang = from.split('-')[0];
            const tLang = to.split('-')[0];
            const url = `https://googleapis.com{sLang}&tl=${tLang}&dt=t&q=${encodeURIComponent(text)}`;
            
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data && data[0] && data[0][0] && data[0][0][0]) {
                        successCallback(data[0][0][0]);
                    } else {
                        successCallback("翻譯解析失敗");
                    }
                })
                .catch(() => {
                    successCallback("網路異常，請再試一次");
                });
        }

        // 語音播放語音合成 (TTS)
        function speakTTS(text, lang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
