<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>旅遊面對面翻譯器</title>
<style>
:root{--bg:#111827;--panel2:#f8fafc;--dark:#111827;--muted:#94a3b8;--accent:#22c55e;--danger:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
body{background:var(--bg)}button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;height:100vh;display:flex;flex-direction:column}
.top{height:50%;background:#0f172a;color:white;position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden;transform:rotate(180deg)}
.bottom{height:50%;background:var(--panel2);color:var(--dark);position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.content{padding:18px;display:flex;flex-direction:column;gap:12px;height:100%;justify-content:center}
.label{font-size:15px;font-weight:800;text-align:center;opacity:.85}
.result{min-height:90px;max-height:48%;overflow:auto;text-align:center;font-size:clamp(25px,7vw,44px);font-weight:750;line-height:1.35;display:flex;align-items:center;justify-content:center;word-break:break-word;padding:4px}
.source{font-size:16px;line-height:1.4;text-align:center;opacity:.72;max-height:18%;overflow:auto}
.mic{width:min(31vw,118px);height:min(31vw,118px);min-width:82px;min-height:82px;border:0;border-radius:50%;align-self:center;background:var(--accent);color:#052e16;font-size:42px;box-shadow:0 8px 30px #0005;touch-action:none}
.mic.listening{background:var(--danger);color:white}
.hint{text-align:center;font-size:14px;color:var(--muted);font-weight:650}
.input-row{display:flex;gap:8px;align-items:stretch}
textarea{width:100%;height:78px;resize:none;border:2px solid #cbd5e1;border-radius:16px;padding:13px 14px;font-size:20px;line-height:1.35;outline:none;background:white;color:#0f172a}
textarea:focus{border-color:#64748b}
.send{width:82px;border:0;border-radius:16px;background:#111827;color:white;font-size:24px;font-weight:800}
.toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.top .toolbar{transform:rotate(180deg)}
.toolbar-group{display:flex;gap:7px}
.tool{border:1px solid #475569;background:#1e293bcc;color:white;border-radius:12px;padding:9px 11px;font-size:14px;font-weight:800;backdrop-filter:blur(8px)}
.bottom .tool{background:white;color:#0f172a;border-color:#cbd5e1}
.langbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lang{min-width:90px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:14px;background:white;font-weight:900;font-size:17px}
.lang.active{background:#111827;color:white;border-color:#111827}
.status{position:absolute;bottom:8px;left:10px;right:10px;text-align:center;font-size:12px;color:#64748b}
.top .status{transform:rotate(180deg);color:#94a3b8}
.engine{font-size:12px;text-align:center;color:#64748b;margin-top:8px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal.show{display:flex}
.card{width:min(520px,100%);background:white;color:#111827;border-radius:22px;padding:22px;box-shadow:0 20px 60px #0008}
.card h2{margin:0 0 8px;font-size:22px}.card p{font-size:14px;line-height:1.55;color:#475569}
.card input{width:100%;padding:13px;border:2px solid #cbd5e1;border-radius:12px;font-size:16px}
.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;padding:13px;border:0;border-radius:12px;font-weight:850}
.save{background:#111827;color:white}.close{background:#e2e8f0}
@media (orientation:landscape){.result{font-size:clamp(22px,5vw,38px)}.mic{width:82px;height:82px}}
</style>
</head>
<body>
<div class="app">
<section class="top">
<div class="toolbar"><button class="tool" id="speakBtn" type="button">🔊 朗讀</button><button class="tool" id="clearTop" type="button">清除</button></div>
<div class="content">
<div class="label" id="targetLabel">🇹🇭 泰文</div>
<div class="result" id="topResult">按住麥克風說話</div>
<div class="source" id="topSource"></div>
<button class="mic" id="micBtn" type="button">🎤</button>
<div class="hint" id="micHint">按住說話・放開後自動翻譯</div>
</div>
<div class="status" id="topStatus">翻譯引擎：待機</div>
</section>

<section class="bottom">
<div class="toolbar"><button class="tool" id="settingsBtn" type="button">⚙ API設定</button><div class="toolbar-group"><button class="tool" id="swapBtn" type="button">🔄 交換</button><button class="tool" id="clearBottom" type="button">清除</button></div></div>
<div class="content">
<div class="label">🇹🇼 繁體中文</div>
<div class="input-row"><textarea id="textInput" placeholder="在這裡打字，送出後翻譯…" lang="zh-TW"></textarea><button class="send" id="sendBtn" type="button">翻譯</button></div>
<div class="langbar"><button class="lang active" type="button" data-lang="th">🇹🇭 泰文</button><button class="lang" type="button" data-lang="en">🇺🇸 英文</button></div>
<div class="engine" id="engineInfo">免費翻譯模式</div>
</div>
<div class="status" id="bottomStatus">目前方向：繁體中文 → 泰文</div>
</section>
</div>

<div class="modal" id="modal">
<div class="card">
<h2>Google Cloud Translation（選用）</h2>
<p>不設定 API Key 也可以使用免費翻譯。若你有自己的 Google Cloud Translation API Key，可在此輸入。</p>
<input id="apiKey" type="password" placeholder="Google Cloud Translation API Key">
<div class="actions"><button class="close" id="cancelSettings" type="button">取消</button><button class="save" id="saveSettings" type="button">儲存</button></div>
</div>
</div>

<script>
(function(){
'use strict';

const $=id=>document.getElementById(id);

const safeStorage={
 get(k,d=''){try{return localStorage.getItem(k)||d}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
 remove(k){try{localStorage.removeItem(k)}catch(e){}}
};

const LANG={
 th:{name:'泰文',flag:'🇹🇭',speech:'th-TH'},
 en:{name:'英文',flag:'🇺🇸',speech:'en-US'}
};

const state={
 target:safeStorage.get('targetLang','th'),
 apiKey:safeStorage.get('googleTranslateApiKey',''),
 recognition:null,
 listening:false
};

function setTarget(lang){
 if(!LANG[lang])lang='th';
 state.target=lang;
 safeStorage.set('targetLang',lang);
 document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
 $('targetLabel').textContent=LANG[lang].flag+' '+LANG[lang].name;
 $('bottomStatus').textContent='目前方向：繁體中文 → '+LANG[lang].name;
}

function setStatus(t){$('topStatus').textContent=t}
function setEngine(t){$('engineInfo').textContent=t}

function decode(s){
 const el=document.createElement('textarea');
 el.innerHTML=s;
 return el.value;
}

async function google(text,target){
 if(!state.apiKey)throw new Error('NO_KEY');
 const r=await fetch('https://translation.googleapis.com/language/translate/v2?key='+encodeURIComponent(state.apiKey),{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({q:text,source:'zh-TW',target:target,format:'text'})
 });
 if(!r.ok)throw new Error('GOOGLE_'+r.status);
 const j=await r.json();
 const out=j&&j.data&&j.data.translations&&j.data.translations[0]&&j.data.translations[0].translatedText;
 if(!out)throw new Error('GOOGLE_EMPTY');
 return decode(out);
}

async function myMemory(text,target){
 const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=zh-TW%7C'+encodeURIComponent(target);
 const r=await fetch(url,{cache:'no-store'});
 if(!r.ok)throw new Error('MYMEMORY_'+r.status);
 const j=await r.json();
 const out=j&&j.responseData&&j.responseData.translatedText;
 if(!out)throw new Error('MYMEMORY_EMPTY');
 return decode(out);
}

async function translate(text){
 if(!text.trim())return '';
 setStatus('翻譯中…');
 try{
  if(state.apiKey){
   const out=await google(text,state.target);
   setEngine('翻譯引擎：Google Cloud Translation');
   setStatus('翻譯完成');
   return out;
  }
 }catch(e){console.warn(e)}
 try{
  const out=await myMemory(text,state.target);
  setEngine('翻譯引擎：免費 MyMemory');
  setStatus('翻譯完成');
  return out;
 }catch(e){
  console.error(e);
  setEngine('翻譯引擎：連線失敗');
  setStatus('翻譯失敗，請檢查網路');
  throw e;
 }
}

function show(source,out){
 $('topSource').textContent=source;
 $('topResult').textContent=out||'—';
}

async function doTranslate(){
 const text=$('textInput').value.trim();
 if(!text)return;
 const b=$('sendBtn');
 b.disabled=true;b.textContent='…';
 try{
  show(text,await translate(text));
 }catch(e){
  $('topResult').textContent='翻譯失敗';
 }finally{
  b.disabled=false;b.textContent='翻譯';
 }
}

function initRecognition(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
  $('micHint').textContent='此瀏覽器不支援語音辨識，請使用 Chrome';
  return null;
 }
 try{
  const r=new SR();
  r.lang='zh-TW';
  r.continuous=false;
  r.interimResults=true;
  r.maxAlternatives=1;

  r.onstart=()=>{
   state.listening=true;
   $('micBtn').classList.add('listening');
   $('micHint').textContent='正在聽…說完放開';
   setStatus('正在語音辨識…');
  };

  r.onresult=async e=>{
   let finalText='',interim='';
   for(let i=e.resultIndex;i<e.results.length;i++){
    const t=e.results[i][0].transcript;
    if(e.results[i].isFinal)finalText+=t;
    else interim+=t;
   }
   $('topSource').textContent=finalText||interim;
   if(finalText){
    try{
     show(finalText,await translate(finalText));
    }catch(err){
     $('topResult').textContent='翻譯失敗';
    }
   }
  };

  r.onerror=e=>setStatus('語音辨識：'+(e.error||'失敗'));
  r.onend=()=>{
   state.listening=false;
   $('micBtn').classList.remove('listening');
   $('micHint').textContent='按住說話・放開後自動翻譯';
  };
  return r;
 }catch(e){
  console.error(e);
  return null;
 }
}

function startMic(){
 if(!state.recognition)state.recognition=initRecognition();
 if(!state.recognition){
  setStatus('此瀏覽器不支援語音辨識');
  return;
 }
 try{state.recognition.start()}catch(e){console.warn(e)}
}

function stopMic(){
 if(state.recognition&&state.listening){
  try{state.recognition.stop()}catch(e){}
 }
}

function clearAll(){
 $('topResult').textContent='按住麥克風說話';
 $('topSource').textContent='';
 $('textInput').value='';
 setStatus('翻譯引擎：待機');
}

setTarget(state.target);
setEngine(state.apiKey?'Google Cloud 優先；失敗使用免費備援':'免費翻譯模式');

$('sendBtn').addEventListener('click',doTranslate);
$('textInput').addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){
  e.preventDefault();
  doTranslate();
 }
});

document.querySelectorAll('.lang').forEach(b=>{
 b.addEventListener('click',()=>{
  setTarget(b.dataset.lang);
  if($('textInput').value.trim())doTranslate();
 });
});

$('micBtn').addEventListener('pointerdown',e=>{e.preventDefault();startMic()});
['pointerup','pointercancel','pointerleave'].forEach(ev=>{
 $('micBtn').addEventListener(ev,e=>{e.preventDefault();stopMic()});
});

$('clearTop').addEventListener('click',clearAll);
$('clearBottom').addEventListener('click',clearAll);

$('speakBtn').addEventListener('click',()=>{
 const t=$('topResult').textContent.trim();
 if(!t||t==='按住麥克風說話')return;
 if(!window.speechSynthesis){
  setStatus('此瀏覽器不支援朗讀');
  return;
 }
 const u=new SpeechSynthesisUtterance(t);
 u.lang=LANG[state.target].speech;
 speechSynthesis.cancel();
 speechSynthesis.speak(u);
});

$('swapBtn').addEventListener('click',()=>{
 setTarget(state.target==='th'?'en':'th');
});

$('settingsBtn').addEventListener('click',()=>{
 $('apiKey').value=state.apiKey;
 $('modal').classList.add('show');
});

$('cancelSettings').addEventListener('click',()=>{
 $('modal').classList.remove('show');
});

$('saveSettings').addEventListener('click',()=>{
 state.apiKey=$('apiKey').value.trim();
 if(state.apiKey)safeStorage.set('googleTranslateApiKey',state.apiKey);
 else safeStorage.remove('googleTranslateApiKey');
 $('modal').classList.remove('show');
 setEngine(state.apiKey?'Google Cloud 優先；失敗使用免費備援':'免費翻譯模式');
});

$('modal').addEventListener('click',e=>{
 if(e.target===$('modal'))$('modal').classList.remove('show');
});

})();
</script>
</body>
</html>
